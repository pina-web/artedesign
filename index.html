<style>
:root{
  --ink:#15161C; --ink2:#4A4E60; --ink3:#8A8FA3;
  --chrome:#E7E8EF; --panel:#FFFFFF; --line:#D9DAE5; --line2:#EEEFF5;
  --accent:#2B44FF; --accent-soft:#E8EBFF; --mint:#00BFA5; --warn:#FF4D5E;
  --r:10px; --shadow:0 1px 2px rgba(21,22,28,.06),0 8px 24px rgba(21,22,28,.08);
  --f:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--chrome);color:var(--ink);font-size:13px;
  -webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 레이아웃 ───────────────────────────── */
#app{display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:7px;margin-right:6px}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.04em}
.brand span{font-size:10px;color:var(--ink3);letter-spacing:.14em;font-weight:600}
.spacer{flex:1}
.body{flex:1;display:flex;min-height:0}
.rail{width:78px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;overflow-y:auto}
.rtab{width:68px;padding:8px 0 6px;border-radius:10px;display:flex;flex-direction:column;align-items:center;
  gap:4px;color:var(--ink2);transition:.12s}
.rtab svg{width:22px;height:22px}
.rtab i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:-.02em}
.rtab:hover{background:#F2F3F8;color:var(--ink)}
.rtab.on{background:var(--accent);color:#fff}
.railgap{flex:1;min-height:8px}
.lpanel{width:0;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:width .16s}
.lpanel.open{width:300px}
.lpanel header{padding:11px 14px 9px;font-size:12px;font-weight:800;letter-spacing:-.01em;color:var(--ink);
  border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;flex:none}
.lpx{width:24px;height:24px;border-radius:6px;color:var(--ink3);font-size:17px;line-height:1}
.lpx:hover{background:#F2F3F8;color:var(--ink)}
.lp{flex:1;overflow-y:auto;padding:12px 14px 22px}
.lpsec{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--ink3);margin:14px 0 7px}
.lpsec:first-child{margin-top:0}
.lphelp{color:var(--ink3);font-size:11px;line-height:1.65;margin-top:12px;padding-top:10px;border-top:1px solid var(--line2)}
.btn.wide{width:100%;justify-content:center}
.lp .shapes{width:auto;grid-template-columns:repeat(4,1fr)}
.lp .shapes button{width:100%;aspect-ratio:1;height:auto}
#lineGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.linep{border:1px solid var(--line);border-radius:9px;padding:7px 8px 5px;background:#fff;text-align:left}
.linep:hover{border-color:var(--accent);background:var(--accent-soft)}
.linep i{font-style:normal;display:block;font-size:10px;font-weight:700;color:var(--ink3);margin-top:3px}
.lp .tpls{grid-template-columns:repeat(2,1fr);gap:8px}
.lp .tpl span{padding:6px 7px;font-size:11px}
.lp .sizes{grid-template-columns:1fr;gap:6px;margin-bottom:10px}
.mytpl{display:grid;grid-template-columns:64px 1fr;gap:9px;align-items:center;border:1px solid var(--line);
  border-radius:10px;padding:8px;margin-bottom:8px}
.mytpl .th{border-radius:6px;overflow:hidden;border:1px solid var(--line2);background:#fff}
.mytpl .th svg{display:block;width:100%;height:auto}
.mytpl b{display:block;font-size:12px;margin-bottom:2px}
.mytpl i{font-style:normal;font-size:10px;color:var(--ink3)}
.mytpl .acts{display:flex;gap:4px;margin-top:6px}
.mytpl .acts button{height:24px;padding:0 8px;border-radius:6px;background:#F2F3F8;font-size:10.5px;font-weight:700;color:var(--ink2)}
.mytpl .acts button:hover{background:#E4E7F5;color:var(--ink)}
.imgrec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.imgrec button{aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#F7F8FC}

function snap(){
  const s=JSON.stringify({w:doc.w,h:doc.h,mm:doc.mm,pages:doc.pages});
  if(hist[hpos]===s)return;
  hist=hist.slice(0,hpos+1); hist.push(s); if(hist.length>80)hist.shift(); hpos=hist.length-1; saveLocal(); upNav();
}
function restore(i){
  if(i<0||i>=hist.length)return; hpos=i;
  const s=JSON.parse(hist[i]);
  doc.w=s.w;doc.h=s.h;doc.mm=s.mm;doc.pages=s.pages;
  doc.cur=clamp(doc.cur,0,doc.pages.length-1); sel=[]; fit(); render(); upNav();
}

function wrapLines(it){
  measure.font=`${it.fw} ${it.fs}px ${it.ff}`;
  const out=[];
  String(it.text).split('\n').forEach(par=>{
    if(!par){out.push({t:'',last:true});return;}
    let ln='', buf=[];
    for(const ch of par){
      const t=ln+ch;
      const wpx=measure.measureText(t).width+(t.length-1)*(it.ls||0);
      if(wpx>it.w&&ln){buf.push(ln);ln=ch;}else ln=t;
    }
    buf.push(ln);
    buf.forEach((t,i)=>out.push({t,last:i===buf.length-1}));
  });
  return out;
}
const lines=it=>wrapLines(it).map(o=>o.t);
const textH=it=>Math.max(it.fs*it.lh*wrapLines(it).length,it.fs);

function vOffset(it,n){
  if(!it.va||it.va==='top')return 0;
  const ch=n*it.fs*it.lh;
  return it.va==='mid'?Math.max(0,(it.h-ch)/2):Math.max(0,it.h-ch);
}

function fxCSS(f){
  if(!f)return '';
  const d=[];
  if(f.b!=null&&f.b!=100)d.push(`brightness(${f.b}%)`);
  if(f.c!=null&&f.c!=100)d.push(`contrast(${f.c}%)`);
  if(f.s!=null&&f.s!=100)d.push(`saturate(${f.s}%)`);
  if(f.g)d.push(`grayscale(${f.g}%)`);
  if(f.se)d.push(`sepia(${f.se}%)`);
  if(f.hr)d.push(`hue-rotate(${f.hr}deg)`);
  if(f.bl)d.push(`blur(${f.bl}px)`);
  return d.join(' ');
}

function defsFor(it){
  let d='';
  if(it.grad&&it.fill!=='none'){
    const a=(it.gang||90)*Math.PI/180, x2=(Math.cos(a)+1)/2, y2=(Math.sin(a)+1)/2;
    d+=`<linearGradient id="g${it.id}" gradientUnits="userSpaceOnUse"`
      +` x1="${((1-x2)*it.w).toFixed(2)}" y1="${((1-y2)*it.h).toFixed(2)}"`
      +` x2="${(x2*it.w).toFixed(2)}" y2="${(y2*it.h).toFixed(2)}">`
      +`<stop offset="0" stop-color="${it.fill}"/><stop offset="1" stop-color="${it.fill2}"/></linearGradient>`;
  }
  if(it.shadow)d+=`<filter id="s${it.id}" x="-30%" y="-30%" width="170%" height="170%">`
    +`<feDropShadow dx="0" dy="${Math.max(3,it.h*.03).toFixed(1)}" stdDeviation="${Math.max(4,it.h*.035).toFixed(1)}" flood-color="#15161C" flood-opacity="0.22"/></filter>`;
  return d;
}
function paintOf(it){ return it.grad&&it.fill!=='none' ? `url(#g${it.id})` : it.fill; }

function drawItem(it){
  if(it.hidden)return'';
  const f=paintOf(it), fl=it.shadow?` filter="url(#s${it.id})"`:'';
  const st=(it.stroke&&it.stroke!=='none'&&it.sw>0)?` stroke="${it.stroke}" stroke-width="${it.sw}"`
    +(it.dash?` stroke-dasharray="${it.dash} ${Math.round(it.dash*.75)}" stroke-linecap="round"`:''):'';
  const op=it.opacity<1?` opacity="${it.opacity}"`:'';
  let inner='';
  if(it.type==='rect')
    inner=`<rect width="${it.w}" height="${it.h}" rx="${it.radius}" fill="${f}"${st}/>`;
  else if(it.type==='ellipse')
    inner=`<ellipse cx="${it.w/2}" cy="${it.h/2}" rx="${it.w/2}" ry="${it.h/2}" fill="${f}"${st}/>`;
  else if(it.type==='shape')
    inner=`<g transform="scale(${it.w/100},${it.h/100})"><path d="${SHAPES[it.kind].d}" fill="${f}"${st} vector-effect="non-scaling-stroke"/></g>`;
  else if(it.type==='line'){
    const sw=Math.max(.5,it.sw||4), y=it.h/2, L=sw*3.4, Wd=sw*1.9;
    let x1=0, x2=it.w;
    if(it.a1==='arrow')x1+=L*.92;
    if(it.a2==='arrow')x2-=L*.92;
    if(x2<x1){const m=(x1+x2)/2;x1=m;x2=m;}
    const da=lineDash(it);
    inner=`<line x1="${x1.toFixed(2)}" y1="${y}" x2="${x2.toFixed(2)}" y2="${y}" stroke="${it.stroke}" `
      +`stroke-width="${sw}" stroke-linecap="${da?'round':(it.cap||'round')}"`
      +(da?` stroke-dasharray="${da.join(' ')}"`:'')+`/>`;
    const cap=(kind,at,dir)=>{
      if(kind==='arrow')return `<path d="M${at} ${y} L${at-dir*L} ${y-Wd} L${at-dir*L} ${y+Wd} Z" fill="${it.stroke}"/>`;
      if(kind==='dot')return `<circle cx="${at}" cy="${y}" r="${(sw*1.35).toFixed(2)}" fill="${it.stroke}"/>`;
      if(kind==='bar')return `<rect x="${(at-sw/2).toFixed(2)}" y="${(y-sw*1.9).toFixed(2)}" `
        +`width="${sw}" height="${(sw*3.8).toFixed(2)}" fill="${it.stroke}"/>`;
      return '';
    };
    inner+=cap(it.a1,0,-1)+cap(it.a2,it.w,1);
  }
  else if(it.type==='image')
    {const fx=fxCSS(it.fx);
    if(!it.href){
      const sc=Math.min(it.w,it.h)/100;
      inner=frameFillSVG(it,'#DDE0EC')
        +`<g transform="translate(${it.w/2},${it.h/2}) scale(${(sc*0.3).toFixed(3)})" `
        +`fill="none" stroke="#8A90AC" stroke-width="6" stroke-linejoin="round">`
        +`<rect x="-34" y="-24" width="68" height="48" rx="6"/><circle cx="0" cy="2" r="12"/>`
        +`<path d="M-14 -24l6-8h16l6 8"/></g>`;
    }else{
      inner=`<clipPath id="c${it.id}">${framePathSVG(it)}</clipPath>`
        +`<image href="${it.href}" width="${it.w}" height="${it.h}" preserveAspectRatio="xMidYMid slice" `
        +`clip-path="url(#c${it.id})"${fx?` style="filter:${fx}"`:''}/>`;
    }}
  else if(it.type==='text'){
    const L=wrapLines(it), lh=it.fs*it.lh, jus=it.align==='justify';
    const anc=jus?'start':it.align==='center'?'middle':it.align==='right'?'end':'start';
    const tx=jus?0:it.align==='center'?it.w/2:it.align==='right'?it.w:0;
    const off=vOffset(it,L.length);
    const spans=L.map((o,i)=>{
      const jl=(jus&&!o.last&&o.t.length>1)?` textLength="${it.w}" lengthAdjust="spacing"`:'';
      return `<tspan x="${tx}" y="${(off+it.fs*0.82+i*lh).toFixed(1)}"${jl} xml:space="preserve">${esc(o.t)||' '}</tspan>`;
    }).join('');
    const base=`font-family="${esc(it.ff)}" font-size="${it.fs}" font-weight="${it.fw}" `
      +`text-anchor="${anc}"${it.ls?` letter-spacing="${it.ls}"`:''}`;
    /* 외곽선은 아래에 한 번, 글자 속은 그 위에 한 번 — paint-order 미지원 렌더러에서도 동일 */
    const hasO=it.stroke&&it.stroke!=='none'&&it.sw>0;
    inner=(hasO?`<text ${base} fill="none" stroke="${it.stroke}" stroke-width="${it.sw*2}" `
      +`stroke-linejoin="round" stroke-linecap="round">${spans}</text>`:'')
      +`<text ${base} fill="${f}">${spans}</text>`;
  }
  return `<g transform="${xf(it)}"${op}${fl} data-id="${it.id}">${inner}</g>`;
}

function framePathSVG(it){
  const k=it.frame;
  if(!k||k==='rect')return `<rect width="${it.w}" height="${it.h}" rx="${it.radius||0}"/>`;
  if(k==='ellipse')return `<ellipse cx="${it.w/2}" cy="${it.h/2}" rx="${it.w/2}" ry="${it.h/2}"/>`;
  const d=SHAPES[k]&&SHAPES[k].d;
  if(!d)return `<rect width="${it.w}" height="${it.h}" rx="${it.radius||0}"/>`;
  return `<path d="${d}" transform="scale(${it.w/100},${it.h/100})"/>`;
}
function frameFillSVG(it,fill){
  const k=it.frame;
  if(!k||k==='rect')return `<rect width="${it.w}" height="${it.h}" rx="${it.radius||0}" fill="${fill}"/>`;
  if(k==='ellipse')return `<ellipse cx="${it.w/2}" cy="${it.h/2}" rx="${it.w/2}" ry="${it.h/2}" fill="${fill}"/>`;
  const d=SHAPES[k]&&SHAPES[k].d;
  if(!d)return `<rect width="${it.w}" height="${it.h}" fill="${fill}"/>`;
  return `<g transform="scale(${it.w/100},${it.h/100})"><path d="${d}" fill="${fill}"/></g>`;
}
function lineDash(it){
  const sw=Math.max(.5,it.sw||4);
  if(it.lstyle==='dot')return [0.01,(sw*2.2).toFixed(2)];
  if(it.lstyle==='dash')return [(sw*3).toFixed(2),(sw*2.2).toFixed(2)];
  if(it.lstyle==='dashdot')return [(sw*4).toFixed(2),(sw*1.8).toFixed(2),0.01,(sw*1.8).toFixed(2)];
  return null;
}
function xf(it){
  let t=`translate(${it.x.toFixed(2)},${it.y.toFixed(2)})`;
  if(it.rot)t+=` rotate(${it.rot},${it.w/2},${it.h/2})`;
  if(it.flipH||it.flipV)t+=` translate(${it.w/2},${it.h/2}) scale(${it.flipH?-1:1},${it.flipV?-1:1}) translate(${-it.w/2},${-it.h/2})`;
  return t;
}

  }
  return {def:`<radialGradient id="${id}" cx="${((g.cx||50)/100).toFixed(4)}" cy="${((g.cy||50)/100).toFixed(4)}" `
    +`r="${((g.r||75)/100).toFixed(4)}">${st}</radialGradient>`, fill:`url(#${id})`};
}
let thumbSeq=0;
function isolate(svg){
  const p='t'+(++thumbSeq)+'-';
  return svg.replace(/id="([^"]+)"/g,'id="'+p+'$1"').replace(/url\(#([^)]+)\)/g,'url(#'+p+'$1)');
}
function pageSVG(p,w,h){
  const its=p.items, bg=bgPaint(p,w,h);
  return `<defs>${bg.def}${its.map(defsFor).join('')}</defs>`
    +`<rect width="${w}" height="${h}" fill="${bg.fill}"/>`
    +its.map(drawItem).join('');
}

/* ════════ 렌더 ════════ */
function render(){
  paper.setAttribute('viewBox',`0 0 ${doc.w} ${doc.h}`);
  overlay.setAttribute('viewBox',`0 0 ${doc.w} ${doc.h}`);
  items().forEach(it=>{if(it.type==='text'&&!it.fixedH)it.h=textH(it);});
  paper.innerHTML=pageSVG(page(),doc.w,doc.h);
  drawOverlay(); drawStrip(); drawInspector();
}
function drawOverlay(){
  const S=selItems().filter(i=>!i.hidden);
  let o='';
  guides.forEach(g=>{ o+= g.v!==undefined
    ? `<line x1="${g.v}" y1="0" x2="${g.v}" y2="${doc.h}" stroke="#00BFA5" stroke-width="${1.4/zoom}"/>`
    : `<line x1="0" y1="${g.h}" x2="${doc.w}" y2="${g.h}" stroke="#00BFA5" stroke-width="${1.4/zoom}"/>`;});
  const k=1/zoom;
  if(lineAnchor&&linePreview){
    o+=`<line x1="${lineAnchor.x}" y1="${lineAnchor.y}" x2="${linePreview.x}" y2="${linePreview.y}" `
      +`stroke="#2B44FF" stroke-width="${1.8*k}" stroke-dasharray="${6*k} ${4*k}"/>`
      +`<circle cx="${lineAnchor.x}" cy="${lineAnchor.y}" r="${4.5*k}" fill="#2B44FF"/>`
      +`<circle cx="${linePreview.x}" cy="${linePreview.y}" r="${4.5*k}" fill="#fff" stroke="#2B44FF" stroke-width="${1.8*k}"/>`;
  }
  S.forEach(it=>{
    o+=`<g transform="translate(${it.x},${it.y}) rotate(${it.rot||0},${it.w/2},${it.h/2})">`
      +`<rect width="${it.w}" height="${it.h}" fill="none" stroke="#2B44FF" stroke-width="${1.6*k}" stroke-dasharray="${S.length>1?6*k+' '+4*k:''}"/>`;
    if(S.length===1&&!it.locked){
      const r=5.5*k;
      const pts=[[0,0,'nw'],[it.w/2,0,'n'],[it.w,0,'ne'],[it.w,it.h/2,'e'],[it.w,it.h,'se'],[it.w/2,it.h,'s'],[0,it.h,'sw'],[0,it.h/2,'w']];
      pts.forEach(([px,py])=>{o+=`<rect x="${px-r}" y="${py-r}" width="${r*2}" height="${r*2}" rx="${1.5*k}" fill="#fff" stroke="#2B44FF" stroke-width="${1.6*k}"/>`;});
      o+=`<line x1="${it.w/2}" y1="0" x2="${it.w/2}" y2="${-26*k}" stroke="#2B44FF" stroke-width="${1.6*k}"/>`
        +`<circle cx="${it.w/2}" cy="${-26*k}" r="${6*k}" fill="#2B44FF"/>`;
    }
    o+='</g>';
  });
  overlay.innerHTML=o;
}
function drawStrip(){
  $('#pgCount').textContent=doc.pages.length+'장';
  $('#strip').innerHTML=doc.pages.map((p,i)=>
    `<div class="pg${i===doc.cur?' on':''}" data-i="${i}">
      <svg viewBox="0 0 ${doc.w} ${doc.h}" xmlns="http://www.w3.org/2000/svg">${isolate(pageSVG(p,doc.w,doc.h))}</svg>
      <span class="no">${i+1}</span>${doc.pages.length>1?'<button class="x" data-del="'+i+'">×</button>':''}
    </div>`).join('');
}

/* ════════ 좌표 ════════ */
function fit(){
  const st=$('#stage'), pad=68;
  zoom=Math.min((st.clientWidth-pad)/doc.w,(st.clientHeight-pad)/doc.h,1);
  if(!isFinite(zoom)||zoom<=0)zoom=Math.min(1,900/doc.w);
  zoom=clamp(zoom,.02,8);
  applyZoom();
}
function applyZoom(){
  wrap.style.width=doc.w*zoom+'px'; wrap.style.height=doc.h*zoom+'px';
  $('#zoomLbl').textContent=Math.round(zoom*100)+'%';
  drawOverlay();
}
function pt(e){const r=paper.getBoundingClientRect();
  return{x:(e.clientX-r.left)*doc.w/r.width,y:(e.clientY-r.top)*doc.h/r.height};}
const rot=(x,y,a)=>({x:x*Math.cos(a)-y*Math.sin(a),y:x*Math.sin(a)+y*Math.cos(a)});

function hitTest(p){
  for(let i=items().length-1;i>=0;i--){
    const it=items()[i]; if(it.hidden||it.locked)continue;
    const cx=it.x+it.w/2, cy=it.y+it.h/2;
    const l=rot(p.x-cx,p.y-cy,-(it.rot||0)*Math.PI/180);
    const pad=it.type==='line'?Math.max(10,it.sw):0;
    if(Math.abs(l.x)<=it.w/2+pad&&Math.abs(l.y)<=it.h/2+pad)return it;
  }
  return null;
}
function handleAt(p){
  if(sel.length!==1)return null;
  const it=byId(sel[0]); if(!it||it.locked)return null;
  const cx=it.x+it.w/2, cy=it.y+it.h/2;
  const l=rot(p.x-cx,p.y-cy,-(it.rot||0)*Math.PI/180);
  const g=10/zoom, hw=it.w/2, hh=it.h/2;
  if(Math.abs(l.x)<g&&Math.abs(l.y+hh+26/zoom)<g+4/zoom)return 'rot';
  const H=[['nw',-hw,-hh],['n',0,-hh],['ne',hw,-hh],['e',hw,0],['se',hw,hh],['s',0,hh],['sw',-hw,hh],['w',-hw,0]];
  for(const [k,x,y] of H) if(Math.abs(l.x-x)<g&&Math.abs(l.y-y)<g)return k;
  return null;
}

/* ════════ 포인터 조작 ════════ */
let drag=null, tapT=0, tapP=null, tapId=null, lastDbl=0;
/* 캔버스는 조작할 때마다 다시 그려져 SVG 노드가 교체된다.
   그러면 브라우저가 두 클릭을 같은 대상으로 보지 않아 dblclick이 오지 않으므로 직접 판정한다. */
function openFor(it){
  lastDbl=Date.now();
  sel=[it.id]; drag=null; render();
  if(it.type==='text')openEditor(it,false);
  else if(it.type==='image')$('#fileImg').click();
}
wrap.addEventListener('pointerdown',e=>{
  if(e.target===editor)return;
  const p=pt(e);

  if(tool==='select'&&!editing){
    const h0=hitTest(p), now=Date.now();
    if(h0&&tapId===h0.id&&now-tapT<450&&tapP&&Math.hypot(p.x-tapP.x,p.y-tapP.y)<14/Math.max(zoom,.05)){
      e.preventDefault(); tapT=0; tapId=null; openFor(h0); return;
    }
    tapT=now; tapP=p; tapId=h0?h0.id:null;
  }

  wrap.setPointerCapture(e.pointerId); closePops();

  if(tool!=='select'){ startCreate(p,e); return; }

  const h=handleAt(p);
  if(h){ const it=byId(sel[0]);
    drag={mode:h==='rot'?'rot':'size',h,start:p,o:JSON.parse(JSON.stringify(it)),it}; return; }

  const hitObj=hitTest(p);
  if(hitObj){
    if(e.shiftKey){ sel.includes(hitObj.id)?sel=sel.filter(s=>s!==hitObj.id):sel.push(hitObj.id); }
    else if(!sel.includes(hitObj.id)) sel=[hitObj.id];
    drag={mode:'move',start:p,o:selItems().map(i=>({id:i.id,x:i.x,y:i.y}))};
  }else{ sel=[]; drag={mode:'marquee',start:p,now:p}; }
  drawOverlay(); drawInspector();
});
let lineAnchor=null, linePreview=null, lineStyle={sw:.008,lstyle:'solid',a1:'none',a2:'none'};
function lineSnap(a,b,shift){
  if(!shift)return b;
  const ang=Math.atan2(b.y-a.y,b.x-a.x), len=Math.hypot(b.x-a.x,b.y-a.y);
  const q=Math.round(ang/(Math.PI/12))*(Math.PI/12);
  return {x:a.x+Math.cos(q)*len, y:a.y+Math.sin(q)*len};
}
function finishLine(a,b){
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
  lineAnchor=null; linePreview=null;
  if(len<8){drawOverlay();return;}
  const it=mk('line',{
    x:Math.round((a.x+b.x)/2-len/2), y:Math.round((a.y+b.y)/2), w:Math.round(len), h:0,
    rot:Math.round(Math.atan2(dy,dx)*180/Math.PI*10)/10,
    sw:Math.max(1,Math.round(lineStyle.sw*doc.w)),
    lstyle:lineStyle.lstyle||'solid', a1:lineStyle.a1||'none', a2:lineStyle.a2||'none',
    cap:lineStyle.cap||'round'});
  add(it); setTool('select');
}
function startCreate(p,e){
  if(tool==='line'){
    if(lineAnchor){ finishLine(lineAnchor,lineSnap(lineAnchor,p,e.shiftKey)); return; }
    lineAnchor=p; linePreview=p; drawOverlay();
    hint('끝점을 클릭하면 선이 그어집니다. 끌어서 그려도 됩니다 · Shift 각도 고정 · Esc 취소');
    return;
  }
  let it;
  if(tool==='text') it=mk('text',{x:p.x,y:p.y,w:Math.min(700,doc.w*.7)});
  else if(tool==='line') it=mk('line',{x:p.x,y:p.y,w:1,h:0});
  else if(tool==='rect'||tool==='ellipse') it=mk(tool,{x:p.x,y:p.y,w:1,h:1,radius:tool==='rect'?Math.round(doc.w*.012):0});
  else{ it=mk('shape',{kind:shapeKind,x:p.x,y:p.y,w:1,h:1});
    if(SHAPES[shapeKind].open)Object.assign(it,{fill:'none',stroke:'#15161C',sw:Math.max(2,Math.round(doc.w*.008))}); }
  add(it,true); sel=[it.id];
  drag=(tool==='text')?null:{mode:'draw',start:p,it};
  if(tool==='text'){ it.h=textH(it); snap(); setTool('select'); render(); openEditor(it,true); }
  else render();
}
wrap.addEventListener('pointermove',e=>{
  if(lineAnchor){ linePreview=lineSnap(lineAnchor,pt(e),e.shiftKey); drawOverlay(); return; }
  if(!drag)return;
  const p=pt(e); guides=[];
  if(drag.mode==='move'){
    let dx=p.x-drag.start.x, dy=p.y-drag.start.y;
    if(sel.length===1){
      const it=byId(sel[0]), o=drag.o[0];
      const sn=snapTo(o.x+dx,o.y+dy,it.w,it.h); dx=sn.x-o.x; dy=sn.y-o.y;
    }
    if(e.shiftKey){ Math.abs(dx)>Math.abs(dy)?dy=0:dx=0; }
    drag.o.forEach(o=>{const it=byId(o.id); if(it&&!it.locked){it.x=Math.round(o.x+dx);it.y=Math.round(o.y+dy);}});
  }
  else if(drag.mode==='draw'){
    const it=drag.it;
    let w=p.x-drag.start.x, h=p.y-drag.start.y;
    if(e.shiftKey&&it.type!=='line'){const m=Math.max(Math.abs(w),Math.abs(h));w=Math.sign(w||1)*m;h=Math.sign(h||1)*m;}
    if(it.type==='line'){
      const len=Math.max(4,Math.hypot(w,h));
      let ang=Math.atan2(h,w)*180/Math.PI;
      if(e.shiftKey)ang=Math.round(ang/15)*15;
      const cx=drag.start.x+w/2, cy=drag.start.y+h/2;
      it.w=Math.round(len); it.h=0; it.rot=Math.round(ang);
      it.x=Math.round(cx-len/2); it.y=Math.round(cy); }
    else{ it.x=w<0?p.x:drag.start.x; it.y=h<0?p.y:drag.start.y; it.w=Math.max(2,Math.abs(w)); it.h=Math.max(2,Math.abs(h)); }
  }
  else if(drag.mode==='size') resize(p,e.shiftKey);
  else if(drag.mode==='rot'){
    const it=drag.it, cx=it.x+it.w/2, cy=it.y+it.h/2;
    let a=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI+90;
    if(e.shiftKey)a=Math.round(a/15)*15;
    it.rot=Math.round(a);
  }
  else if(drag.mode==='marquee'){ drag.now=p; drag.moved=1; marquee(); return; }
  drag.moved=1;
  paper.innerHTML=pageSVG(page(),doc.w,doc.h); drawOverlay(); drawInspector();
});
function resize(p,keep){
  const it=drag.it, o=drag.o, a=(o.rot||0)*Math.PI/180;
  const d=rot(p.x-drag.start.x,p.y-drag.start.y,-a);
  const sx=drag.h.includes('e')?1:drag.h.includes('w')?-1:0;
  const sy=drag.h.includes('s')?1:drag.h.includes('n')?-1:0;
  let nw=Math.max(8,o.w+sx*d.x), nh=Math.max(it.type==='line'?0:8,o.h+sy*d.y);
  if(it.type==='line')nh=0;
  /* 모서리 손잡이: 비율 유지 대상이면 기본 유지, Shift로 일시 해제 (반대는 그 반대) */
  const corner=!!(sx&&sy), ratio=corner&&it.type!=='text'&&(isLocked(it)?!keep:keep);
  if(ratio&&o.h>0&&o.w>0){
    const r=o.w/o.h;
    if(Math.abs(nw-o.w)>=Math.abs(nh-o.h)*r) nh=nw/r; else nw=nh*r;
    nw=Math.max(8,nw); nh=Math.max(8,nh);
  }
  if(it.type==='text'&&sy)it.fixedH=true;
  const dw=nw-o.w, dh=nh-o.h;
  const off=rot(sx*dw/2,sy*dh/2,a);
  const cx=o.x+o.w/2+off.x, cy=o.y+o.h/2+off.y;
  it.w=Math.round(nw); it.h=Math.round(nh);
  it.x=Math.round(cx-it.w/2); it.y=Math.round(cy-it.h/2);
  if(it.type==='text'&&!it.fixedH)it.h=textH(it);
}
function snapTo(x,y,w,h){
  const T=7/zoom; guides=[];
  const cand=[[0,'l'],[doc.w/2-w/2,'c'],[doc.w-w,'r']];
  items().filter(i=>!sel.includes(i.id)&&!i.hidden).forEach(i=>{cand.push([i.x,'l'],[i.x+i.w-w,'r'],[i.x+i.w/2-w/2,'c']);});
  for(const [v,k] of cand) if(Math.abs(x-v)<T){x=v;guides.push({v:k==='l'?v:k==='r'?v+w:v+w/2});break;}
  const candY=[[0,'t'],[doc.h/2-h/2,'m'],[doc.h-h,'b']];
  items().filter(i=>!sel.includes(i.id)&&!i.hidden).forEach(i=>{candY.push([i.y,'t'],[i.y+i.h-h,'b'],[i.y+i.h/2-h/2,'m']);});
  for(const [v,k] of candY) if(Math.abs(y-v)<T){y=v;guides.push({h:k==='t'?v:k==='b'?v+h:v+h/2});break;}
  return{x,y};
}
function marquee(){
  const a=drag.start,b=drag.now;
  const R={x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)};
  sel=items().filter(i=>!i.hidden&&!i.locked&&i.x<R.x+R.w&&i.x+i.w>R.x&&i.y<R.y+R.h&&i.y+i.h>R.y).map(i=>i.id);
  drawOverlay();
  overlay.insertAdjacentHTML('beforeend',
    `<rect x="${R.x}" y="${R.y}" width="${R.w}" height="${R.h}" fill="#2B44FF" fill-opacity=".07" stroke="#2B44FF" stroke-width="${1.4/zoom}"/>`);
}
wrap.addEventListener('pointerup',()=>{
  if(lineAnchor){
    if(linePreview&&Math.hypot(linePreview.x-lineAnchor.x,linePreview.y-lineAnchor.y)>10/Math.max(zoom,.05))
      finishLine(lineAnchor,linePreview);
    return;
  }
  if(!drag)return;
  if(!drag.moved&&(drag.mode==='move'||drag.mode==='marquee')){
    drag=null; guides=[]; drawOverlay(); return;
  }
  if(drag.mode==='draw'){ const it=drag.it;
    if(it.w<10&&Math.abs(it.h)<10){ it.w=Math.round(doc.w*.28); it.h=it.type==='line'?0:Math.round(doc.w*.28);
      it.x=Math.round(it.x-it.w/2); it.y=Math.round(it.y-it.h/2); }
    setTool('select');
  }
  drag=null; guides=[]; snap(); render();
});
wrap.addEventListener('dblclick',e=>{
  if(editing||Date.now()-lastDbl<700)return;
  const it=hitTest(pt(e)); if(!it)return;
  openFor(it);
});

/* ════════ 글자 인라인 편집 ════════ */
let editing=null;
/* 편집 중 글자가 바탕에 묻히지 않도록 대비를 계산해 바탕·글자색을 고른다 */
const _lum=a=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
  return .2126*f(a[0])+.7152*f(a[1])+.0722*f(a[2]);};
const _ratio=(a,b)=>{const L1=_lum(a),L2=_lum(b);return (Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05);};
function editorSkin(fill){
  let c=fill;
  if(!c||c==='none'||!/^#/.test(c))c='#15161C';
  const rgb=hex2rgb(c);
  const rw=_ratio(rgb,[255,255,255]), rd=_ratio(rgb,[20,22,30]);
  const onWhite=rw>=rd, best=Math.max(rw,rd);
  return {
    bg: onWhite?'#FFFFFF':'#14161E',
    line: onWhite?'#2B44FF':'#6C86D9',
    fg: best>=4.5 ? c : (onWhite?'#15161C':'#FFFFFF')
  };
}
function openEditor(it,sa){
  editing=it; const r=paper.getBoundingClientRect(), k=r.width/doc.w;
  const skin=editorSkin(it.fill);
  const voff=vOffset(it,wrapLines(it).length);
  Object.assign(editor.style,{display:'block',left:it.x*k+'px',top:(it.y+voff)*k+'px',
    width:it.w*k+'px',height:Math.max(textH(it),it.fs)*k+'px',
    fontSize:it.fs*k+'px',fontWeight:it.fw,fontFamily:it.ff,
    color:skin.fg,background:skin.bg,outlineColor:skin.line,caretColor:skin.line,
    textAlign:it.align,lineHeight:it.lh,letterSpacing:it.ls*k+'px',
    transform:`rotate(${it.rot||0}deg)`,transformOrigin:'center'});
  editor.value=it.text; editor.focus();
  if(sa)editor.select(); else{const n=editor.value.length;editor.setSelectionRange(n,n);}
  hint('✎ 편집 중입니다 — 내용을 고친 뒤 캔버스 빈 곳을 누르면 반영됩니다. 줄바꿈은 Enter.');
}
editor.addEventListener('input',()=>{ if(!editing)return; editing.text=editor.value;
  if(!editing.fixedH)editing.h=textH(editing); paper.innerHTML=pageSVG(page(),doc.w,doc.h); });
editor.addEventListener('blur',()=>{ if(!editing)return; editing=null; editor.style.display='none'; snap(); render();
  hint('도형이나 글자를 끌어서 옮기고, 모서리 점을 잡아 크기를 바꾸세요.'); });
editor.addEventListener('keydown',e=>{ if(e.key==='Escape')editor.blur(); e.stopPropagation(); });

/* ════════ 색상환 ════════ */
function hex2rgb(h){h=String(h||'').replace('#','');
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-f]{6}$/i.test(h))h='2B44FF';
  const n=parseInt(h.slice(0,6),16);return [n>>16&255,n>>8&255,n&255];}
const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('').toUpperCase();
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0;
  if(d)h=60*(mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4));
  return [h,mx?d/mx:0,mx];}
function hsv2rgb(h,s,v){h=((h%360)+360)%360;
  const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
  const t=[[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(h/60)%6];
  return [(t[0]+m)*255,(t[1]+m)*255,(t[2]+m)*255];}
const LSC='arte.recent.colors';
const recentColors=()=>{try{return JSON.parse(localStorage.getItem(LSC)||'[]')}catch(e){return[]}};
function pushColor(c){let a=recentColors().filter(x=>x!==c);a.unshift(c);
  try{localStorage.setItem(LSC,JSON.stringify(a.slice(0,18)))}catch(e){}}
function drawWheel(cv,h,s,v){
  const x=cv.getContext('2d'),W=cv.width,C=W/2,R=C-1,R2=C-22;
  x.clearRect(0,0,W,W);
  for(let a=0;a<360;a++){
    const a0=(a-0.9)*Math.PI/180,a1=(a+0.9)*Math.PI/180,c=hsv2rgb(a,1,1);
    x.beginPath();x.arc(C,C,R,a0,a1);x.arc(C,C,R2,a1,a0,true);x.closePath();
    x.fillStyle=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;x.fill();
  }
  const q=R2*Math.SQRT1_2, sx=C-q, sy=C-q, sw=q*2, hc=hsv2rgb(h,1,1);
  x.fillStyle=`rgb(${hc[0]|0},${hc[1]|0},${hc[2]|0})`;x.fillRect(sx,sy,sw,sw);
  let g=x.createLinearGradient(sx,0,sx+sw,0);
  g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(sx,sy,sw,sw);
  g=x.createLinearGradient(0,sy,0,sy+sw);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(sx,sy,sw,sw);
  const ring=(px,py)=>{x.beginPath();x.arc(px,py,7,0,Math.PI*2);
    x.lineWidth=3;x.strokeStyle='#fff';x.stroke();x.lineWidth=1;x.strokeStyle='rgba(0,0,0,.45)';x.stroke();};
  const ha=h*Math.PI/180,hr=(R+R2)/2;
  ring(C+Math.cos(ha)*hr,C+Math.sin(ha)*hr);
  ring(sx+s*sw,sy+(1-v)*sw);
  return {C,R,R2,sx,sy,sw};
}
let wheelOff=null;
function openWheel(cur,onLive,onDone,anchor){
  const pop=$('#wheelPop'); pop.classList.add('open');
  const r=anchor.getBoundingClientRect();
  pop.style.left=Math.max(8,Math.min(innerWidth-244,r.left-140))+'px';
  pop.style.top=Math.max(8,Math.min(innerHeight-360,r.bottom+8))+'px';
  let hsv=rgb2hsv(...hex2rgb(cur&&cur!=='none'?cur:'#2B44FF'));
  const cv=$('#wCv'); let geo;
  const cur2=()=>rgb2hex(...hsv2rgb(hsv[0],hsv[1],hsv[2]));
  const paint=()=>{geo=drawWheel(cv,hsv[0],hsv[1],hsv[2]);
    const hx=cur2(); $('#wHex').value=hx; $('#wPrev').style.background=hx;};
  const rec=()=>{$('#wRecent').innerHTML=recentColors().map(c=>
    `<button data-rc="${c}" style="background:${c}"></button>`).join('')||'<span style="color:var(--ink3);font-size:11px">없음</span>';};
  paint(); rec();
  let mode=null;
  const at=e=>{const b=cv.getBoundingClientRect();
    return{x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height};};
  const move=e=>{ if(!mode)return; const p=at(e);
    if(mode==='h')hsv[0]=Math.atan2(p.y-geo.C,p.x-geo.C)*180/Math.PI;
    else{hsv[1]=clamp((p.x-geo.sx)/geo.sw,0,1);hsv[2]=clamp(1-(p.y-geo.sy)/geo.sw,0,1);}
    paint(); onLive(cur2()); };
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);
    const p=at(e), d=Math.hypot(p.x-geo.C,p.y-geo.C);
    mode=d>geo.R2-2?'h':'s'; move(e);};
  cv.onpointermove=move;
  cv.onpointerup=()=>{if(mode){mode=null;onDone(cur2());}};
  $('#wHex').onchange=()=>{const t=$('#wHex').value.trim();
    if(!/^#?[0-9a-f]{3,6}$/i.test(t)){toast('#FF0000 형식으로 적어주세요');return;}
    hsv=rgb2hsv(...hex2rgb(t)); paint(); onLive(cur2()); onDone(cur2());};
  $('#wRecent').onclick=e=>{const b=e.target.closest('[data-rc]');if(!b)return;
    hsv=rgb2hsv(...hex2rgb(b.dataset.rc)); paint(); onLive(cur2()); onDone(cur2());};
  const dp=$('#wDrop');
  dp.style.display=window.EyeDropper?'inline-flex':'none';
  dp.onclick=()=>{ new window.EyeDropper().open().then(r=>{
      hsv=rgb2hsv(...hex2rgb(r.sRGBHex)); paint(); onLive(cur2()); onDone(cur2());}).catch(()=>{}); };
  $('#wOk').onclick=()=>closeWheel(true);
  wheelOff=()=>{const c=cur2(); pushColor(c); onDone(c);};
}
function closeWheel(commit){
  const p=$('#wheelPop'); if(!p.classList.contains('open'))return false;
  p.classList.remove('open');
  if(commit&&wheelOff)wheelOff();
  wheelOff=null; return true;
}
document.addEventListener('pointerdown',e=>{
  if($('#wheelPop').classList.contains('open')&&!e.target.closest('#wheelPop')&&!e.target.closest('[data-wheel]')&&!e.target.closest('#bgWheel'))
    closeWheel(true);
},true);

  box.querySelectorAll('[data-fxp]').forEach(b=>b.onclick=()=>{

  box.querySelectorAll('[data-swf]').forEach(b=>b.onclick=()=>{

  box.querySelectorAll('[data-wheel]').forEach(b=>b.onclick=()=>{

           paper.innerHTML=pageSVG(page(),doc.w,doc.h); },

      b);

let dragLay=null;
function bindLayers(){
  $$('#ins [data-lay]').forEach(el=>{
    el.onclick=e=>{ if(e.target.closest('[data-vis],[data-lk],[data-lopa]'))return;
      sel=[el.dataset.lay]; render(); };
    el.ondragstart=e=>{dragLay=el.dataset.lay;try{e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',dragLay);}catch(x){}};
    el.ondragover=e=>{e.preventDefault();el.classList.add('drop');};
    el.ondragleave=()=>el.classList.remove('drop');
    el.ondrop=e=>{e.preventDefault();el.classList.remove('drop');
      const to=el.dataset.lay; if(!dragLay||dragLay===to)return;
      const A=items(), f=A.findIndex(i=>i.id===dragLay), t=A.findIndex(i=>i.id===to);
      if(f<0||t<0)return;
      const [m]=A.splice(f,1); A.splice(t,0,m);
      dragLay=null; snap(); render();};
    el.ondragend=()=>{dragLay=null;$$('#ins .lay').forEach(x=>x.classList.remove('drop'));};
  });
  $$('#ins [data-vis]').forEach(b=>b.onclick=()=>{const i=byId(b.dataset.vis);i.hidden=!i.hidden;snap();render();});
  $$('#ins [data-lk]').forEach(b=>b.onclick=()=>{const i=byId(b.dataset.lk);i.locked=!i.locked;snap();render();});
  $$('#ins [data-lopa]').forEach(el=>{
    el.oninput=()=>{const i=byId(el.dataset.lopa); if(!i)return; i.opacity=parseFloat(el.value);
      paper.innerHTML=pageSVG(page(),doc.w,doc.h);};
    el.onchange=()=>{snap();render();};
  });
  $$('#ins [data-frame]').forEach(b=>b.onclick=()=>{
    selItems().forEach(i=>{if(i.type==='image')i.frame=b.dataset.frame;});snap();render();});
}

function act(a){
  if(a==='fontPage'||a==='fontAll'){
    const el=$('#pgFont'); if(!el)return;
    const v=FONTS[+el.value].v;
    (a==='fontAll'?doc.pages:[page()]).forEach(pg=>pg.items.forEach(i=>{if(i.type==='text')i.ff=v;}));
    snap(); render(); toast('글꼴을 바꿨습니다'); return;
  }
  if(a==='strokeOff'){selItems().forEach(i=>{i.sw=0;i.stroke='none';});snap();render();return;}
  if(a==='strokeOn'){selItems().forEach(i=>{
    if(!i.stroke||i.stroke==='none')i.stroke='#15161C';
    if(!i.sw)i.sw=Math.max(1,Math.round(doc.w*.006));});snap();render();return;}
  if(a==='lineH'||a==='lineV'||a==='lineSwap'){
    selItems().forEach(i=>{ if(i.type!=='line')return;
      if(a==='lineH')i.rot=0; else if(a==='lineV')i.rot=90;
      else {const t=i.a1;i.a1=i.a2;i.a2=t;} });
    snap(); render(); return;
  }
  if(a==='editText'){const it=selItems()[0]; if(it&&it.type==='text')openEditor(it,false); return;}
  if(a==='autoH'){selItems().forEach(i=>{if(i.type==='text'){i.fixedH=false;i.h=textH(i);}});snap();render();return;}
  if(a==='fxReset'){selItems().forEach(i=>i.fx=null);snap();render();return;}
  const S=selItems(); if(!S.length&&!['dup'].includes(a))return;
  const bb=bbox(S);
  const mv={alignL:()=>S.forEach(i=>i.x+=0-bb.x),alignR:()=>S.forEach(i=>i.x+=doc.w-(bb.x+bb.w)),
    alignC:()=>S.forEach(i=>i.x+=(doc.w-bb.w)/2-bb.x),alignT:()=>S.forEach(i=>i.y+=0-bb.y),
    alignB:()=>S.forEach(i=>i.y+=doc.h-(bb.y+bb.h)),alignM:()=>S.forEach(i=>i.y+=(doc.h-bb.h)/2-bb.y)};
  if(mv[a]){mv[a]();}
  else if(a==='fwd'){ const A=items();
    [...S].sort((p,q)=>A.indexOf(q)-A.indexOf(p)).forEach(i=>{const k=A.indexOf(i);
      if(k<A.length-1){A.splice(k,1);A.splice(k+1,0,i);}}); }
  else if(a==='bwd'){ const A=items();
    [...S].sort((p,q)=>A.indexOf(p)-A.indexOf(q)).forEach(i=>{const k=A.indexOf(i);
      if(k>0){A.splice(k,1);A.splice(k-1,0,i);}}); }
  else if(a==='front'){S.forEach(i=>{const k=items().indexOf(i);items().splice(k,1);items().push(i);});}
  else if(a==='back'){[...S].reverse().forEach(i=>{const k=items().indexOf(i);items().splice(k,1);items().unshift(i);});}
  else if(a==='rotL')S.forEach(i=>i.rot=(((i.rot||0)-90)%360+360)%360);
  else if(a==='rotR')S.forEach(i=>i.rot=(((i.rot||0)+90)%360+360)%360);
  else if(a==='rot0')S.forEach(i=>i.rot=0);
  else if(a==='flipH')S.forEach(i=>i.flipH=!i.flipH);
  else if(a==='flipV')S.forEach(i=>i.flipV=!i.flipV);
  else if(a==='sq')S.forEach(i=>{if(i.type!=='text'&&i.type!=='line'){const m=Math.round((i.w+i.h)/2);i.x=Math.round(i.x+(i.w-m)/2);i.y=Math.round(i.y+(i.h-m)/2);i.w=m;i.h=m;}});
  else if(a==='fitRatio'){
    const ims=S.filter(i=>i.type==='image'); if(!ims.length)return;
    Promise.all(ims.map(i=>loadImg(i.href).then(im=>{i.h=Math.round(i.w*im.height/im.width);}).catch(()=>{})))
      .then(()=>{snap();render();toast('사진 원본 비율로 맞췄습니다');});
    return;
  }
  else if(a==='dup')duplicate();
  else if(a==='del'){page().items=items().filter(i=>!sel.includes(i.id));sel=[];}
  else if(a==='lock'){S.forEach(i=>i.locked=!i.locked);}
  snap(); render();
}
function bbox(S){const x=Math.min(...S.map(i=>i.x)),y=Math.min(...S.map(i=>i.y));
  return{x,y,w:Math.max(...S.map(i=>i.x+i.w))-x,h:Math.max(...S.map(i=>i.y+i.h))-y};}
function duplicate(){
  const S=selItems(); if(!S.length)return;
  const nw=S.map(i=>{const c=JSON.parse(JSON.stringify(i));c.id=uid();c.x+=24;c.y+=24;items().push(c);return c.id;});
  sel=nw;
}

document.addEventListener('keydown',e=>{
  if($('#startScreen').classList.contains('on'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  const m=e.ctrlKey||e.metaKey;
  if(m&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(m&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if(m&&e.key.toLowerCase()==='d'){e.preventDefault();duplicate();snap();render();return;}
  if(m&&e.key.toLowerCase()==='c'){clip=JSON.stringify(selItems());return;}
  if(m&&e.key.toLowerCase()==='v'){ if(!clip)return;
    const arr=JSON.parse(clip); sel=arr.map(c=>{c.id=uid();c.x+=30;c.y+=30;items().push(c);return c.id;});
    snap();render();return;}
  if(m&&e.key.toLowerCase()==='a'){e.preventDefault();sel=items().filter(i=>!i.locked).map(i=>i.id);render();return;}
  if(m&&e.key.toLowerCase()==='s'){e.preventDefault();saveFile();return;}
  if(e.key==='Delete'||e.key==='Backspace'){if(sel.length){e.preventDefault();act('del');}return;}
  if((e.key==='Enter'||e.key==='F2')&&sel.length===1){
    const it=byId(sel[0]);
    if(it&&it.type==='text'&&!it.locked){e.preventDefault();openEditor(it,false);return;}
  }
  if(e.key==='Escape'){
    if(lineAnchor){lineAnchor=null;linePreview=null;drawOverlay();return;}
    if(closePanel())return; sel=[];setTool('select');render();return;}
  if(e.key.startsWith('Arrow')&&sel.length){e.preventDefault();
    const d=e.shiftKey?10:1;
    selItems().forEach(i=>{if(i.locked)return;
      if(e.key==='ArrowLeft')i.x-=d; if(e.key==='ArrowRight')i.x+=d;
      if(e.key==='ArrowUp')i.y-=d; if(e.key==='ArrowDown')i.y+=d;});
    render(); clearTimeout(window._nud); window._nud=setTimeout(snap,400); return;}
  const T={v:'select',t:'text',r:'rect',o:'ellipse',l:'line'};
  if(T[e.key.toLowerCase()])setTool(T[e.key.toLowerCase()]);
});

/* 스펙 → 실제 개체 */
function build(sp,W,H,thIdx,fontIdx){
  const th=THEMES[thIdx!=null?thIdx:(sp.th||0)];
  const C=c=>(th[c]!==undefined?th[c]:c);
  const out=[];
  sp.it.forEach(a=>{
    const last=a[a.length-1];
    const o=(last&&typeof last==='object'&&!Array.isArray(last))?last:{};
    const ex={rot:o.rot||0,opacity:o.op!=null?o.op:1,shadow:!!o.sh,
      stroke:o.st?C(o.st):'none',sw:o.sw?Math.round(o.sw*W):0,
      grad:!!o.g2,fill2:o.g2?C(o.g2):'#FFFFFF',gang:o.ga!=null?o.ga:90,
      dash:o.da?Math.max(2,Math.round(o.da*W)):0};
    if(a[0]==='r')out.push(mk('rect',{x:a[1]*W,y:a[2]*H,w:a[3]*W,h:a[4]*H,fill:C(a[5]),radius:Math.round((o.rad||0)*W),...ex}));
    else if(a[0]==='e')out.push(mk('ellipse',{x:a[1]*W,y:a[2]*H,w:a[3]*W,h:a[4]*H,fill:C(a[5]),...ex}));
    else if(a[0]==='s')out.push(mk('shape',{kind:a[1],x:a[2]*W,y:a[3]*H,w:a[4]*W,h:a[5]*H,fill:C(a[6]),...ex}));
    else if(a[0]==='l')out.push(mk('line',{x:a[1]*W,y:a[2]*H,w:a[3]*W,h:0,stroke:C(a[4]),sw:Math.max(1,Math.round(a[5]*W)),rot:o.rot||0}));
    else if(a[0]==='t')out.push(mk('text',{x:a[1]*W,y:a[2]*H,w:a[3]*W,fs:Math.max(8,Math.round(a[4]*W)),
      fw:a[5],fill:C(a[6]),align:a[7],text:a[8],lh:o.lh||1.35,ls:(o.ls||0)*W,...ex}));
  });
  out.forEach(i=>{i.x=Math.round(i.x);i.y=Math.round(i.y);i.w=Math.round(i.w);i.h=Math.round(i.h);
    if(fontIdx!=null&&i.type==='text')i.ff=FONTS[fontIdx].v;});
  return {bg:C(sp.bg||'bg'),items:out};
}

/* 템플릿 화면 */
let tCat='전체', tTheme=null, tFont=null;
function buildTplGrid(){
  $('#tplCats').innerHTML=['전체',...CATS].map(c=>
    `<button class="chip${c===tCat?' on':''}" data-cat="${c}">${c}</button>`).join('');
  $('#tplThemes').innerHTML=`<button class="chip${tTheme===null?' on':''}" data-th="">기본색</button>`
    +THEMES.map((t,i)=>`<button class="chip th${tTheme===i?' on':''}" data-th="${i}">
       <span style="background:${t.bg}"></span><span style="background:${t.p}"></span><span style="background:${t.s}"></span>${t.k}</button>`).join('');
  $('#setRow').innerHTML=SETS.map((s,i)=>`<button class="chip set" data-set="${i}">＋ ${s.n}</button>`).join('');
  $('#tplFonts').innerHTML=`<button class="chip${tFont===null?' on':''}" data-font="">기본 글꼴</button>`
    +FONTS.map((f,i)=>`<button class="chip${tFont===i?' on':''}" data-font="${i}" style="font-family:${f.v}">${f.n}</button>`).join('');

  const list=TPL.map((t,i)=>({t,i})).filter(o=>tCat==='전체'||o.t.c===tCat);
  $('#tplCount').textContent=list.length+'개';
  $('#tplGrid').innerHTML=list.map(({t,i})=>{
    const p=build(t,doc.w,doc.h,tTheme,tFont);
    return `<button class="tpl" data-i="${i}">
      <svg viewBox="0 0 ${doc.w} ${doc.h}" xmlns="http://www.w3.org/2000/svg">${isolate(pageSVG(p,doc.w,doc.h))}</svg>
      <span>${t.n}<i>${t.c}</i></span></button>`;}).join('');
}
function applyTpl(idx,asNew){
  const p=build(TPL[idx],doc.w,doc.h,tTheme,tFont);
  const pg={id:uid(),bg:p.bg,items:p.items};
  if(asNew||$('#tplMode').dataset.v==='new'){doc.pages.splice(doc.cur+1,0,pg);doc.cur++;}
  else doc.pages[doc.cur]=pg;
  sel=[]; snap(); render();
}
document.addEventListener('click',e=>{
  const cat=e.target.closest('[data-cat]'); if(cat){tCat=cat.dataset.cat;buildTplGrid();return;}
  const th=e.target.closest('[data-th]'); if(th){tTheme=th.dataset.th===''?null:+th.dataset.th;buildTplGrid();return;}
  const ft=e.target.closest('[data-font]'); if(ft){tFont=ft.dataset.font===''?null:+ft.dataset.font;buildTplGrid();return;}
  const st=e.target.closest('[data-set]'); if(st){
    const s=SETS[+st.dataset.set];
    s.i.forEach((ti,k)=>{const p=build(TPL[ti],doc.w,doc.h,tTheme,tFont);
      doc.pages.splice(doc.cur+1+k,0,{id:uid(),bg:p.bg,items:p.items});});
    doc.cur++; sel=[]; snap(); render();
    toast(s.n+'을 넣었습니다'); return;}
  const tp=e.target.closest('.tpl'); if(tp&&tp.closest('#tplGrid')){
    applyTpl(+tp.dataset.i);
    toast('템플릿을 적용했습니다 · 글자를 두 번 눌러 고치세요'); return;}
  const md=e.target.closest('#tplMode'); if(md){
    md.dataset.v=md.dataset.v==='new'?'now':'new';
    md.textContent=md.dataset.v==='new'?'새 장으로 추가':'지금 장에 적용'; return;}
});

function svgString(p,embed){
  const st=embed?`<defs><style type="text/css">${FONTCSS.map(u=>`@import url('${u}');`).join('')}</style></defs>`:'';
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" `
    +`width="${doc.w}" height="${doc.h}" viewBox="0 0 ${doc.w} ${doc.h}">${st}${pageSVG(p,doc.w,doc.h)}</svg>`;
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
const stamp=()=>new Date().toISOString().slice(0,10).replace(/-/g,'');

$('#bSvg').onclick=()=>{dl(new Blob([svgString(page(),1)],{type:'image/svg+xml'}),`아르떼조명_카드뉴스_${stamp()}_${doc.cur+1}.svg`);

const imgCache={};
function loadImg(href){
  if(imgCache[href])return Promise.resolve(imgCache[href]);
  return new Promise((res,rej)=>{const im=new Image();
    im.onload=()=>{imgCache[href]=im;res(im);};
    im.onerror=()=>rej(new Error('사진을 불러올 수 없습니다'));im.src=href;});
}
function manualFx(ox,c,f){
  try{
    const d=ox.getImageData(0,0,c.width,c.height), p=d.data;
    const b=(f.b??100)/100, ct=(f.c??100)/100, sa=(f.s??100)/100, g=(f.g||0)/100, se=(f.se||0)/100;
    for(let i=0;i<p.length;i+=4){
      let r=p[i]*b, gr=p[i+1]*b, bl=p[i+2]*b;
      r=(r-128)*ct+128; gr=(gr-128)*ct+128; bl=(bl-128)*ct+128;
      const lum=.2126*r+.7152*gr+.0722*bl;
      r=lum+(r-lum)*sa; gr=lum+(gr-lum)*sa; bl=lum+(bl-lum)*sa;
      if(g){const l2=.2126*r+.7152*gr+.0722*bl; r+=(l2-r)*g; gr+=(l2-gr)*g; bl+=(l2-bl)*g;}
      if(se){const sr=r*.393+gr*.769+bl*.189, sg=r*.349+gr*.686+bl*.168, sb=r*.272+gr*.534+bl*.131;
        r+=(sr-r)*se; gr+=(sg-gr)*se; bl+=(sb-bl)*se;}
      p[i]=clamp(r,0,255); p[i+1]=clamp(gr,0,255); p[i+2]=clamp(bl,0,255);
    }
    ox.putImageData(d,0,0);
  }catch(e){}
}
function filteredImg(it,im){
  const css=fxCSS(it.fx); if(!css)return im;
  const key=it.href+'|'+css;
  if(imgCache[key])return imgCache[key];
  const oc=document.createElement('canvas');
  oc.width=im.width; oc.height=im.height;
  const ox=oc.getContext('2d');
  let done=false;
  try{ if('filter' in ox){ ox.filter=css; ox.drawImage(im,0,0); ox.filter='none'; done=true; } }catch(e){done=false;}
  if(!done){ ox.clearRect(0,0,oc.width,oc.height); ox.drawImage(im,0,0); manualFx(ox,oc,it.fx); }
  imgCache[key]=oc; return oc;
}
function gradOf(x,it){
  if(!it.grad||it.fill==='none')return it.fill;
  const a=(it.gang||90)*Math.PI/180, X=(Math.cos(a)+1)/2, Y=(Math.sin(a)+1)/2;
  const g=x.createLinearGradient((1-X)*it.w,(1-Y)*it.h,X*it.w,Y*it.h);
  g.addColorStop(0,it.fill); g.addColorStop(1,it.fill2||'#FFFFFF'); return g;
}
function boxPath(x,it){
  const k=(it.type==='image')?it.frame:null;
  if(k&&k!=='rect'){
    if(k==='ellipse'){x.beginPath();x.ellipse(it.w/2,it.h/2,it.w/2,it.h/2,0,0,Math.PI*2);return null;}
    const d=SHAPES[k]&&SHAPES[k].d;
    if(d){ try{ const p=new Path2D();
      p.addPath(new Path2D(d),new DOMMatrix([it.w/100,0,0,it.h/100,0,0])); return p; }catch(e){} }
  }
  x.beginPath();
  const r=Math.min(it.radius||0,Math.min(it.w,it.h)/2);
  if(r>0&&x.roundRect)x.roundRect(0,0,it.w,it.h,r); else x.rect(0,0,it.w,it.h);
  return null;
}
async function paintItem(x,it){
  if(it.hidden)return;
  x.save();
  x.translate(it.x,it.y);
  if(it.rot){x.translate(it.w/2,it.h/2);x.rotate(it.rot*Math.PI/180);x.translate(-it.w/2,-it.h/2);}
  if(it.flipH||it.flipV){x.translate(it.w/2,it.h/2);x.scale(it.flipH?-1:1,it.flipV?-1:1);x.translate(-it.w/2,-it.h/2);}
  x.globalAlpha=it.opacity!=null?it.opacity:1;
  if(it.shadow){x.shadowColor='rgba(21,22,28,.22)';
    x.shadowBlur=Math.max(4,it.h*.035)*2; x.shadowOffsetY=Math.max(3,it.h*.03);}
  const fill=gradOf(x,it);
  const hasS=it.stroke&&it.stroke!=='none'&&it.sw>0;
  if(hasS){x.strokeStyle=it.stroke;x.lineWidth=it.sw;
    x.setLineDash(it.dash?[it.dash,Math.round(it.dash*.75)]:[]);
    x.lineCap=it.dash?'round':'butt';}
  const clearShadow=()=>{x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetY=0;};
  const T=it.type;
  if(T==='rect'){
    boxPath(x,it);
    if(it.fill!=='none'){x.fillStyle=fill;x.fill();}
    if(hasS){clearShadow();x.stroke();}
  }else if(T==='ellipse'){
    x.beginPath(); x.ellipse(it.w/2,it.h/2,it.w/2,it.h/2,0,0,Math.PI*2);
    if(it.fill!=='none'){x.fillStyle=fill;x.fill();}
    if(hasS){clearShadow();x.stroke();}
  }else if(T==='shape'){
    const d=SHAPES[it.kind]&&SHAPES[it.kind].d;
    if(d){
      let p2=null;
      try{p2=new Path2D();p2.addPath(new Path2D(d),new DOMMatrix([it.w/100,0,0,it.h/100,0,0]));}catch(e){p2=null;}
      if(p2){
        if(it.fill!=='none'){x.fillStyle=fill;x.fill(p2);}
        if(hasS){clearShadow();x.stroke(p2);}
      }else{
        x.save(); x.scale(it.w/100,it.h/100); const p3=new Path2D(d);
        if(it.fill!=='none'){x.fillStyle=fill;x.fill(p3);}
        if(hasS){clearShadow();x.lineWidth=it.sw*100/Math.max(it.w,1);x.stroke(p3);}
        x.restore();
      }
    }
  }else if(T==='line'){
    const sw=Math.max(.5,it.sw||4), y=it.h/2, L=sw*3.4, Wd=sw*1.9;
    let x1=0, x2=it.w;
    if(it.a1==='arrow')x1+=L*.92;
    if(it.a2==='arrow')x2-=L*.92;
    if(x2<x1){const m=(x1+x2)/2;x1=m;x2=m;}
    const da=lineDash(it);
    x.setLineDash(da?da.map(Number):[]);
    x.beginPath(); x.moveTo(x1,y); x.lineTo(x2,y);
    x.strokeStyle=it.stroke; x.lineWidth=sw; x.lineCap=da?'round':(it.cap||'round'); x.stroke();
    x.setLineDash([]); x.fillStyle=it.stroke;
    const cap=(kind,at,dir)=>{
      if(kind==='arrow'){x.beginPath();x.moveTo(at,y);x.lineTo(at-dir*L,y-Wd);x.lineTo(at-dir*L,y+Wd);x.closePath();x.fill();}
      else if(kind==='dot'){x.beginPath();x.arc(at,y,sw*1.35,0,Math.PI*2);x.fill();}
      else if(kind==='bar'){x.fillRect(at-sw/2,y-sw*1.9,sw,sw*3.8);}
    };
    cap(it.a1,0,-1); cap(it.a2,it.w,1);
  }else if(T==='image'){
    if(!it.href){
      const fp=boxPath(x,it); x.fillStyle='#DDE0EC'; fp?x.fill(fp):x.fill();
      x.restore(); return;
    }
    try{
      const im=filteredImg(it,await loadImg(it.href));
      x.save(); const fp=boxPath(x,it); fp?x.clip(fp):x.clip();
      const ir=im.width/im.height, br=it.w/it.h; let dw,dh;
      if(ir>br){dh=it.h;dw=it.h*ir;}else{dw=it.w;dh=it.w/ir;}
      x.drawImage(im,(it.w-dw)/2,(it.h-dh)/2,dw,dh); x.restore();
    }catch(e){}
  }else if(T==='text'){
    x.font=`${it.fw} ${it.fs}px ${it.ff}`;
    x.textBaseline='alphabetic';
    const L=wrapLines(it), lh=it.fs*it.lh, jus=it.align==='justify';
    const off=vOffset(it,L.length);
    x.textAlign=jus?'left':it.align==='center'?'center':it.align==='right'?'right':'left';
    const tx=jus?0:it.align==='center'?it.w/2:it.align==='right'?it.w:0;
    const hasO=it.stroke&&it.stroke!=='none'&&it.sw>0;
    L.forEach((o,i)=>{
      if(!o.t)return;
      let ls=it.ls||0;
      if(jus&&!o.last&&o.t.length>1){
        try{x.letterSpacing='0px';}catch(e){}
        ls=(it.w-x.measureText(o.t).width)/(o.t.length-1);
      }
      try{x.letterSpacing=ls+'px';}catch(e){}
      const y=off+it.fs*0.82+i*lh;
      if(hasO){x.strokeStyle=it.stroke;x.lineWidth=it.sw*2;x.lineJoin='round';x.lineCap='round';
        x.setLineDash([]);x.strokeText(o.t,tx,y);}
      x.fillStyle=fill; x.fillText(o.t,tx,y);
    });
    try{x.letterSpacing='0px';}catch(e){}
  }
  x.restore();
}
function paintBG(x,p,w,h){
  const g=p.bgGrad;
  if(!g||!g.t||g.t==='solid'){x.fillStyle=p.bg||'#FFFFFF';x.fillRect(0,0,w,h);return;}
  if(g.t==='linear'){
    const a=(g.ang||120)*Math.PI/180, X=(Math.cos(a)+1)/2, Y=(Math.sin(a)+1)/2;
    const lg=x.createLinearGradient((1-X)*w,(1-Y)*h,X*w,Y*h);
    lg.addColorStop(0,g.c1); lg.addColorStop(1,g.c2);
    x.fillStyle=lg; x.fillRect(0,0,w,h); return;
  }
  const cx=w*(g.cx||50)/100, cy=h*(g.cy||50)/100;
  if(g.t==='circle'){
    const R=Math.max(w,h)*(g.r||75)/100;
    const rg=x.createRadialGradient(cx,cy,0,cx,cy,R);
    rg.addColorStop(0,g.c1); rg.addColorStop(1,g.c2);
    x.fillStyle=rg; x.fillRect(0,0,w,h); return;
  }
  /* 방사형: 캔버스에는 타원 그라데이션이 없어 세로로 눌러 흉내낸다 */
  x.save();
  x.translate(cx,cy); x.scale(1,h/w); x.translate(-cx,-cy);
  const R=w*(g.r||75)/100;
  const rg=x.createRadialGradient(cx,cy,0,cx,cy,R);
  rg.addColorStop(0,g.c1); rg.addColorStop(1,g.c2);
  x.fillStyle=rg; x.fillRect(-w,-h*4,w*3,h*9);
  x.restore();
}
async function rasterize(p,scale){
  const c=document.createElement('canvas');
  c.width=Math.round(doc.w*scale); c.height=Math.round(doc.h*scale);
  const x=c.getContext('2d');
  x.scale(scale,scale);
  paintBG(x,p,doc.w,doc.h);
  for(const it of p.items) await paintItem(x,it);
  return c;
}
async function pngOf(p,scale){
  const c=await rasterize(p,scale);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('변환 실패')),'image/png'));
}
async function waitFonts(){ try{ if(document.fonts&&document.fonts.ready)await document.fonts.ready; }catch(e){} }
$('#bPng').onclick=async()=>{
  const all=doc.pages.length>1&&confirm(`전체 ${doc.pages.length}장을 모두 내보낼까요?\n[취소]를 누르면 지금 페이지만 저장합니다.`);
  const list=all?doc.pages:[page()];
  const scale=doc.w>=1500?1:2;
  toast('글꼴을 준비하는 중...');
  await waitFonts();
  toast('내보내는 중...');
  for(let i=0;i<list.length;i++){
    try{ const b=await pngOf(list[i],scale);
      dl(b,`아르떼조명_카드뉴스_${stamp()}_${(all?i:doc.cur)+1}.png`);
      await new Promise(r=>setTimeout(r,320));
    }catch(err){toast('내보내기 실패: '+err.message);return;}
  }
  toast(list.length+'장을 저장했습니다');
};
$('#bPrint').onclick=()=>{
  const mm=doc.mm, w=mm?mm[0]+'mm':doc.w+'px', h=mm?mm[1]+'mm':doc.h+'px';
  const win=window.open('','_blank');
  if(!win){toast('팝업이 막혀 있습니다. 허용해 주세요');return;}
  win.document.write(`<!doctype html><meta charset="utf-8"><title>인쇄</title>
  <style>@page{size:${mm?mm[0]+'mm '+mm[1]+'mm':doc.w+'px '+doc.h+'px'};margin:0}
  html,body{margin:0;padding:0}
  .pg{width:${w};height:${h};page-break-after:always;overflow:hidden}
  .pg svg{width:100%;height:100%;display:block}</style>
  <link rel="stylesheet" href="${FONTCSS[0]}"><link rel="stylesheet" href="${FONTCSS[1]}">
  ${doc.pages.map(p=>`<div class="pg">${svgString(p)}</div>`).join('')}
  <script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script>`);
  win.document.close();
  hint('인쇄 창에서 "대상"을 PDF로 저장으로 바꾸면 벡터 PDF가 만들어집니다.');
};
function saveFile(){
  dl(new Blob([JSON.stringify({v:1,w:doc.w,h:doc.h,mm:doc.mm,pages:doc.pages})],{type:'application/json'}),
    `아르떼조명_카드뉴스_${stamp()}.json`);
  toast('작업 파일을 저장했습니다');
}
$('#bSave').onclick=saveFile;
$('#bOpen').onclick=()=>$('#fileDoc').click();
$('#fileDoc').onchange=e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader(); r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!d.pages)throw 0;
    doc={w:d.w,h:d.h,mm:d.mm||null,pages:d.pages,cur:0}; sel=[]; hist=[];hpos=-1;
    hideStart(); snap(); fit(); render(); toast('작업 파일을 불러왔습니다');
  }catch{toast('열 수 없는 파일입니다');} }; r.readAsText(f); e.target.value='';};

const LS='arte.cardnews.doc';
let starting=true;
function saveLocal(){if(starting)return;
  try{localStorage.setItem(LS,JSON.stringify({w:doc.w,h:doc.h,mm:doc.mm,pages:doc.pages}));}catch(e){}}
function loadLocal(){try{const s=localStorage.getItem(LS);if(!s)return false;
  const d=JSON.parse(s); if(!d.pages||!d.pages.length)return false;
  doc.w=d.w;doc.h=d.h;doc.mm=d.mm||null;doc.pages=d.pages;return true;}catch(e){return false;}}

/* 모바일 패널 */
if(window.matchMedia&&matchMedia('(max-width:900px)').matches){
  $('#bPanel').style.display='inline-flex';
  $('#bPanel').onclick=()=>$('#inspector').classList.toggle('open');
}

/* ════════ 시작 화면 ════════ */
let useIdx=0;
function peekLocal(){try{const t=localStorage.getItem(LS); if(!t)return null;
  const d=JSON.parse(t); return (d&&d.pages&&d.pages.length&&d.pages.some(p=>p.items&&p.items.length))?d:null;
}catch(e){return null;}}
function showStart(){
  const saved=peekLocal();
  const tile=(p,i)=>{const m=54,sc=Math.min(m/p.w,m/p.h);
    return `<button class="use${i===useIdx?' on':''}" data-use="${i}">
      <span class="box" style="width:${Math.max(12,Math.round(p.w*sc))}px;height:${Math.max(12,Math.round(p.h*sc))}px"></span>
      <b>${p.n}</b><i>${p.s}</i></button>`;};
  $('#startBody').innerHTML=
    (saved?`<div class="resume"><div style="flex:1;min-width:0">
        <b style="display:block;font-size:13px;margin-bottom:2px">이어서 작업하기</b>
        <span style="font-size:11.5px;color:var(--ink2)">${saved.pages.length}장 · ${saved.w}×${saved.h}px · 이 브라우저에 자동 저장돼 있습니다</span>
      </div><button class="btn primary" id="stResume">이어하기</button></div>`:'')
    +`<div class="uses">${PRESETS.map(tile).join('')}</div>
      <div class="startgo">
        <button class="btn primary" id="stBlank">빈 페이지로 시작</button>
        <button class="btn" id="stTpl">템플릿 고르고 시작</button>
      </div>
      <div class="startlinks"><span>이미 만들어 둔 파일이 있다면</span>
        <button id="stOpen">파일 열기 (.json)</button>
        ${myTpls().length?`<span>·</span><button id="stStore">내 저장소에서 고르기</button>`:''}</div>`;
  $('#startBody').querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{useIdx=+b.dataset.use;showStart();});
  const R=$('#stResume');
  if(R)R.onclick=()=>{ if(loadLocal()){hist=[];hpos=-1;sel=[];doc.cur=0;hideStart();snap();fit();render();
      toast('이전 작업을 불러왔습니다');} };
  $('#stBlank').onclick=()=>startWith(false);
  $('#stTpl').onclick=()=>startWith(true);
  $('#stOpen').onclick=()=>$('#fileDoc').click();
  const ST=$('#stStore'); if(ST)ST.onclick=()=>{startWith(false);openPanel('store');};
  $('#startScreen').classList.add('on');
}
function startWith(openTpl){
  const p=PRESETS[useIdx];
  doc.w=p.w; doc.h=p.h; doc.mm=p.mm||null;
  doc.pages=[{id:uid(),bg:'#FFFFFF',items:[]}]; doc.cur=0; sel=[];
  hist=[]; hpos=-1; hideStart(); snap(); fit(); render();
  if(openTpl)openPanel('tpl'); else toast(p.n+' · 빈 페이지로 시작합니다');
}
function hideStart(){ starting=false; $('#startScreen').classList.remove('on'); }
$('#bNew').onclick=()=>{ starting=true; showStart(); };

/* ════════ 시작 ════════ */
doc.pages=[{id:uid(),bg:'#FFFFFF',items:[]}];
snap(); fit(); render(); setTool('select'); showStart();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
</script>
